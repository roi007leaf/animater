# GitHub Actions workflow for creating a new Animater release.
#
# On every push/PR it validates the manifest and checks that every file the
# module loads at runtime exists. On a published release it injects the
# release URLs into module.json, zips ONLY the runtime files (see
# tools/release-files.mjs: manifest entry points plus everything they import),
# attaches module.json + module.zip to the release and notifies Foundry.
#
# Foundry's package release API revokes the key when a package publishes too
# often, so Foundry hears about at most one release per 24 hours: a later
# release in that window stays on GitHub (its update link still works) and the
# publish job stops with an error. "Run workflow" (Publish to Foundry) sends an
# existing release to Foundry by hand once the window has passed.
#
# Audits, docs, tests, tools, previews and publication reports never ship.
name: Animater Release Pipeline

env:
  project_url: 'https://github.com/${{github.repository}}'
  latest_manifest_url: 'https://github.com/${{github.repository}}/releases/latest/download/module.json'
  release_module_url: 'https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name}}/module.zip'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to Foundry (for example v1.2.2)'
        required: true
        type: string
      dry_run:
        description: 'Ask Foundry to validate only, without publishing'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The "manifest" release only holds the update link; it is never built.
    # A manual run only publishes an existing release to Foundry.
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'release' || github.event.release.tag_name != 'manifest')
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate Module Manifest
        run: |
          jq empty module.json
          jq -e '.id == "animater" and (.esmodules | length > 0)' module.json > /dev/null
          echo "Manifest is valid JSON with entry points"

      # Fails if any runtime import points at a file missing from the repo.
      - name: Resolve Runtime Files
        run: |
          node tools/release-files.mjs > release-files.txt
          echo "$(wc -l < release-files.txt) runtime files"
          cat release-files.txt

      - name: Extract Version From Tag
        id: get_version
        if: github.event_name == 'release'
        uses: battila7/get-version-action@v2

      - name: Check Tag Matches Manifest Version
        if: github.event_name == 'release'
        run: |
          manifest=$(jq -r .version module.json)
          tag='${{ steps.get_version.outputs.version-without-v }}'
          if [ "$manifest" != "$tag" ]; then echo "module.json version $manifest does not match tag $tag"; exit 1; fi

      - name: Modify Module Manifest With Release-Specific Values
        if: github.event_name == 'release'
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_module_url }}

      - name: Create Module Archive
        if: github.event_name == 'release'
        run: |
          zip ./module.zip -@ < release-files.txt
          unzip -l module.zip | tail -1

      - name: Update Release With Files
        if: github.event_name == 'release'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}

      # Foundry's update link is releases/latest/download/module.json, and GitHub's
      # "latest" skips prereleases. One full release, tagged "manifest", always holds
      # the newest module.json (whose download points at this version's zip), so
      # installed copies find every update, prerelease or not.
      - name: Point The Update Link At This Version
        if: github.event_name == 'release' && github.event.release.draft != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: "Not a version: this release only carries the newest module.json so Foundry's update link (releases/latest/download/module.json) always works. Pick a real version below."
        run: |
          if gh release view manifest >/dev/null 2>&1; then
            gh release upload manifest module.json --clobber
            gh release edit manifest --latest --prerelease=false
          else
            gh release create manifest module.json --title "Update link (latest manifest)" --notes "$NOTES" --latest --target "${{ github.sha }}"
          fi
          echo "Update link now serves $(jq -r .version module.json)"

  publish-to-foundry:
    runs-on: ubuntu-latest
    needs: [build]
    # After a published (non-pre)release's build, or by hand (the build is skipped then).
    if: ${{ always() && ((github.event_name == 'release' && github.event.release.prerelease != true && github.event.release.tag_name != 'manifest' && needs.build.result == 'success') || github.event_name == 'workflow_dispatch') }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Check The Release Exists
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx module.json \
            || { echo "::error::Release $TAG has no module.json asset; publish it on GitHub first."; exit 1; }

      # Foundry revokes the API key when a package publishes too often: at most one release per 24 hours.
      - name: Allow One Foundry Release Per 24 Hours
        run: |
          since=$(date -u -d '24 hours ago' +%s)
          gh api "repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.created_at)"' |
          while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$since" ] && continue
            published=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(.name == "publish-to-foundry" and .conclusion == "success")] | length')
            if [ "$published" -gt 0 ]; then
              echo "::error::Foundry already received a release from run $id at $created (within 24 hours). $TAG stays on GitHub only; its update link works. Publish it later with Run workflow → Publish to Foundry."
              exit 1
            fi
          done

      - name: Publish to Foundry VTT
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://foundryvtt.com/_api/packages/release_version/
          configuration: '{ "method": "POST", "headers": { "Content-Type": "application/json", "Authorization": "${{ secrets.FVTT_API_TOKEN }}" }, "body": { "id": "animater", "dry-run": ${{ env.DRY_RUN }}, "release": { "version": "${{ env.TAG }}", "manifest": "https://github.com/${{github.repository}}/releases/download/${{ env.TAG }}/module.json", "notes": "https://github.com/${{github.repository}}/blob/main/CHANGELOG.md", "compatibility": { "minimum": "14", "verified": "14", "maximum": "" } } } }'
