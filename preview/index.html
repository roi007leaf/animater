<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animater · Workspace Preview</title>
    <link rel="stylesheet" href="../styles/animater.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #090b11;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .animater {
        width: min(1440px, 100%);
        height: calc(100vh - 48px);
        min-height: 720px;
        border: 1px solid #30374a;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 25px 120px #0006;
      }
      @media (max-width: 900px) {
        body {
          padding: 0;
        }
        .animater {
          border-radius: 0;
          width: 100%;
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="animater"><div class="an-root"></div></div>
    <script type="module" src="./preview.mjs"></script>
  </body>
</html>
